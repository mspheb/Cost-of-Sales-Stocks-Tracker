<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lami Baytz Kitchen Manager</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbf5ea;--card:#fff;--ink:#3b1d0c;--mut:#8a6a54;--br:#5c2a0e;--gold:#f2a50c;--line:#ecdcc4;--ok:#2f7d3a;--bad:#c0392b;--bgk:#fff3d6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d130c;--card:#2a1c12;--ink:#f6e9d6;--mut:#c2a68c;--br:#e9b36f;--gold:#f2a50c;--line:#43301f;--ok:#6cc27a;--bad:#ff7b6b;--bgk:#3a2810;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1d130c;--card:#2a1c12;--ink:#f6e9d6;--mut:#c2a68c;--br:#e9b36f;--gold:#f2a50c;--line:#43301f;--ok:#6cc27a;--bad:#ff7b6b;--bgk:#3a2810;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 Nunito,system-ui,sans-serif;padding-bottom:80px}
.wrap{max-width:760px;margin:0 auto;padding:0 14px}
header{display:flex;align-items:center;gap:12px;padding:14px 0 6px}
header img{height:58px;border-radius:12px;background:#fbf5ea}
header h1{font:700 22px Fraunces,Georgia,serif;margin:0;color:var(--br)}header p{margin:0;color:var(--mut);font-size:13px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:2px solid var(--gold);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;border:0;background:none;color:var(--mut);padding:11px 2px;font:700 13px Nunito,sans-serif;cursor:pointer}
nav button.on{color:var(--br);background:var(--bgk);box-shadow:inset 0 3px 0 var(--gold)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px}
.stat b{display:block;font:700 20px Fraunces,Georgia,serif;color:var(--br)}.stat span{font-size:12px;color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0}
.row{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:12px;flex-wrap:wrap}
.between{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.btn{border:0;background:var(--br);color:var(--card);padding:9px 14px;border-radius:10px;font:700 14px Nunito,sans-serif;cursor:pointer}
:root:not([data-theme="light"]) .btn{color:#1d130c}
.btn.gold{background:var(--gold);color:#3b1d0c}.btn.ghost{background:none;border:1px solid var(--line);color:var(--ink)}.btn.sm{padding:6px 10px;font-size:13px}.btn.red{background:none;color:var(--bad);border:1px solid var(--bad)}
input,select{width:100%;padding:9px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);font:inherit}
label{display:block;font-size:12px;color:var(--mut);margin:8px 0 3px;font-weight:700}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;background:var(--bgk);color:var(--br)}
.low{background:var(--bad);color:#fff}.ok{color:var(--ok)}.bad{color:var(--bad)}.mut{color:var(--mut);font-size:13px}
h2{font:700 17px Fraunces,Georgia,serif;color:var(--br);margin:18px 0 4px}
.bar{height:6px;border-radius:4px;background:var(--line);margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}.bar.l i{background:var(--bad)}
dialog{border:0;border-radius:16px;padding:16px;width:min(94vw,460px);background:var(--card);color:var(--ink);max-height:88vh}
dialog::backdrop{background:#0008}dialog h3{margin:0 0 4px;font:700 18px Fraunces,Georgia,serif;color:var(--br)}
.rr{display:grid;grid-template-columns:1fr 80px 28px;gap:6px;margin-bottom:6px;align-items:center}
.x{border:0;background:none;color:var(--bad);font-size:20px;cursor:pointer}
.empty{text-align:center;color:var(--mut);padding:28px 10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;background:var(--br);color:var(--card);padding:10px 16px;border-radius:10px;z-index:20;font-weight:700}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
</style></head><body>

<div id="view"></div></div>
<nav id="nav"></nav><dialog id="m"></dialog>
<script>
const CATS=['Pork','Chicken','Beef','Seafoods','Pasta / Noodles','Desserts / Kakanin','Vegetables','Side Dish'];
const MENU={Pork:['Pork Humba','Pork Laroca','Pork Bola-Bola','Pork Lumpia (50 pcs)','Menudo','Grilled Liempo','Dynamite'],Chicken:['Chicken Lumpia (50 pcs)','Chicken Bufallo Wings','Chicken Curry','Chicken Caldereta','Fried Chicken','Buttered Chicken','Chicken Cordon Bleu'],Beef:['Beef Caldereta','Beefsteak','Beef Laroca'],Seafoods:['Garlic Buttered Shrimp','Crabs','Esabeche Pampano','Camaron Rebosado'],'Pasta / Noodles':['Bam-e','Pancit Canton','Sotanghon Guisado','Carbonara','Spaghetti','No Bake Mac','Pesto Penne','Lasagna'],'Desserts / Kakanin':['Maja Blanca','Mango Float','Puto Cheese','Macaroni Salad','Budbod / Suman (40 pcs)'],Vegetables:['Chopsuey','Mixed Veggies Stirfry'],'Side Dish':['Kimchi']};
const KEY='lamibaytz_v1';let S=load(),tab='stock',q='';
function uid(){return Math.random().toString(36).slice(2,9)}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.ings)return s}catch(e){}
 const dishes=[];for(const c of CATS)for(const n of MENU[c])dishes.push({id:uid(),name:n,cat:c,yield:1,price:0,items:[]});
 return{ings:[],dishes,logs:[]}}
function save(){S.ts=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}cloudSave()}
let ref=null,pend=null;
function cloudSave(){if(!ref)return;clearTimeout(pend);pend=setTimeout(()=>{try{ref.set({json:JSON.stringify(S),ts:S.ts}).catch(()=>{})}catch(e){}},500)}
async function initCloud(){try{if(!window.claude)return;const[user,db]=await Promise.all([claude.use('user'),claude.use('db')]);if(!user||!db)return;const id=await user.id();if(!id)return;ref=db.collection('data/users/'+id).doc('main');const s=await ref.get();const d=s.exists?s.data():null;if(d&&d.json&&(d.ts||0)>(S.ts||0)){const c=JSON.parse(d.json);if(c&&c.ings){S=c;render();return}}cloudSave()}catch(e){}}
const $=id=>document.getElementById(id);
const P=n=>'₱'+(+n||0).toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2});
const N=n=>+(+n).toFixed(3);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ing=id=>S.ings.find(i=>i.id===id);
const dish=id=>S.dishes.find(d=>d.id===id);
const lines=(d,b=1)=>d.items.map(r=>({r,i:ing(r.ing)})).filter(x=>x.i).map(x=>({ing:x.i.id,name:x.i.name,unit:x.i.unit,qty:N(x.r.qty*b),cost:x.r.qty*b*x.i.cost}));
const dcost=d=>lines(d).reduce((a,l)=>a+l.cost,0);
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2000)}
function modal(title,body,onSave,label='Save'){m.innerHTML=`<h3>${title}</h3><div>${body}</div><div class="row"><button class="btn ghost" id="mc">Cancel</button><button class="btn gold" id="ms">${label}</button></div>`;
 $('mc').onclick=()=>m.close();$('ms').onclick=()=>{if(onSave()!==false)m.close()};if(!m.open)m.showModal()}
const v=id=>$(id).value;
function ask(msg,fn){modal('Please confirm',`<p>${esc(msg)}</p>`,()=>{fn()},'Yes')}
function setTab(t){tab=t;q='';render()}
function render(){
 $('nav').innerHTML=[['stock','📦 Stocks'],['dishes','🍲 Menu cost'],['cook','🔥 Cook'],['hist','🧾 History']].map(([k,l])=>`<button class="${tab===k?'on':''}" onclick="setTab('${k}')">${l}</button>`).join('');
 $('view').innerHTML=({stock:vStock,dishes:vDishes,cook:vCook,hist:vHist})[tab]();save()}
function search(ph){return `<input placeholder="${ph}" value="${esc(q)}" oninput="q=this.value;renderKeep(this)" style="margin:8px 0">`}
function renderKeep(el){const pos=el.selectionStart;render();const n=document.querySelector('#view input');n.focus();n.setSelectionRange(pos,pos)}
/* STOCKS */
function vStock(){
 const low=S.ings.filter(i=>i.stock<=i.min&&i.min>0||i.stock<=0).length,val=S.ings.reduce((a,i)=>a+Math.max(0,i.stock)*i.cost,0);
 const list=S.ings.filter(i=>i.name.toLowerCase().includes(q.toLowerCase())).sort((a,b)=>a.name.localeCompare(b.name));
 return `<div class="stats"><div class="stat"><b>${S.ings.length}</b><span>Ingredients</span></div><div class="stat"><b class="${low?'bad':''}">${low}</b><span>Low / out</span></div><div class="stat"><b>${P(val)}</b><span>Stock value</span></div></div>
 <div class="between"><div style="flex:1">${search('Search ingredients')}</div><button class="btn gold" style="margin-top:8px" onclick="editIng()">+ Ingredient</button></div>
 ${list.length?list.map(i=>{const isLow=i.stock<=0||(i.min>0&&i.stock<=i.min),pct=i.min>0?Math.min(100,i.stock/(i.min*2)*100):(i.stock>0?100:0);
 return `<div class="card"><div class="between"><div><b>${esc(i.name)}</b> ${isLow?'<span class="tag low">'+(i.stock<=0?'Out':'Low')+'</span>':''}<div class="mut">${P(i.cost)} per ${esc(i.unit)}</div></div>
 <div style="text-align:right"><b style="font-size:18px" class="${i.stock<0?'bad':''}">${N(i.stock)}</b> <span class="mut">${esc(i.unit)}</span></div></div>
 <div class="bar ${isLow?'l':''}"><i style="width:${pct}%"></i></div>
 <div class="row" style="margin-top:8px"><button class="btn sm" style="background:#c0392b;color:#fff" onclick="restock('${i.id}')">+ Restock</button><button class="btn sm ghost" onclick="editIng('${i.id}')">Edit</button></div></div>`}).join(''):`<div class="empty">No ingredients yet. Tap “+ Ingredient” to add your first one (e.g. Pork liempo, kg, ₱280).</div>`}
 <div class="row" style="justify-content:center;margin-top:24px"><button class="btn sm ghost" onclick="exp()">Export backup</button><button class="btn sm ghost" onclick="imp()">Import backup</button></div>`}
function editIng(id){const i=id?ing(id):{name:'',unit:'kg',cost:'',stock:'',min:''};
 modal(id?'Edit ingredient':'New ingredient',`<label>Name</label><input id="f1" value="${esc(i.name)}"><div class="g2"><div><label>Unit</label><input id="f2" list="u" value="${esc(i.unit)}"><datalist id="u"><option>kg<option>g<option>L<option>ml<option>pc<option>pack<option>can<option>bottle<option>tray<option>sack</datalist></div><div><label>Cost per unit (₱)</label><input id="f3" type="number" step="any" value="${i.cost}"></div><div><label>Stock on hand</label><input id="f4" type="number" step="any" value="${i.stock}"></div><div><label>Low-stock alert at</label><input id="f5" type="number" step="any" value="${i.min}"></div></div>${id?'<div class="row" style="justify-content:flex-start"><button class="btn sm red" id="fd">Delete ingredient</button></div>':''}`,()=>{
 if(!v('f1').trim())return false;const o=id?i:{id:uid()};Object.assign(o,{name:v('f1').trim(),unit:v('f2').trim()||'pc',cost:+v('f3')||0,stock:+v('f4')||0,min:+v('f5')||0});if(!id)S.ings.push(o);render()});
 if(id)$('fd').onclick=()=>{const used=S.dishes.filter(d=>d.items.some(r=>r.ing===id)).length;ask(used?`Used in ${used} recipe(s). Delete anyway?`:'Delete this ingredient?',()=>{S.ings=S.ings.filter(x=>x.id!==id);S.dishes.forEach(d=>d.items=d.items.filter(r=>r.ing!==id));render()})}}
function restock(id){const i=ing(id);modal('Restock '+esc(i.name),`<label>Quantity bought (${esc(i.unit)})</label><input id="f1" type="number" step="any" autofocus><label>New price per ${esc(i.unit)} (optional)</label><input id="f2" type="number" step="any" placeholder="${i.cost}"><p class="mut">Current stock: ${N(i.stock)} ${esc(i.unit)}</p>`,()=>{const n=+v('f1');if(!n)return false;i.stock=N(i.stock+n);if(v('f2'))i.cost=+v('f2');render();toast('Stock added')},'Add stock')}
/* DISHES */
function rowH(r){return `<div class="rr"><select>${S.ings.map(i=>`<option value="${i.id}" ${i.id===r.ing?'selected':''}>${esc(i.name)} (${esc(i.unit)})</option>`).join('')}</select><input type="number" step="any" placeholder="Qty" value="${r.qty??''}"><button class="x" onclick="this.parentNode.remove()">×</button></div>`}
function addRow(){$('rows').insertAdjacentHTML('beforeend',rowH({}))}
function editDish(id){const d=id?dish(id):{name:'',cat:CATS[0],yield:1,price:'',items:[]};
 if(!S.ings.length){toast('Add your ingredients in the Stocks tab first');setTab('stock');return}
 modal(id?'Edit recipe':'New dish',`<label>Dish name</label><input id="f1" value="${esc(d.name)}"><div class="g2"><div><label>Category</label><select id="f2">${CATS.map(c=>`<option ${c===d.cat?'selected':''}>${c}</option>`).join('')}</select></div><div><label>Servings / pcs per batch</label><input id="f3" type="number" step="any" value="${d.yield}"></div></div><label>Selling price for the whole batch (₱)</label><input id="f4" type="number" step="any" value="${d.price}"><label>Ingredients used per batch</label><div id="rows">${d.items.map(rowH).join('')}</div><button class="btn sm ghost" onclick="addRow()">+ Add ingredient</button>${id?'<div class="row" style="justify-content:flex-start"><button class="btn sm red" id="fd">Delete dish</button></div>':''}`,()=>{
 if(!v('f1').trim())return false;const items=[...document.querySelectorAll('#rows .rr')].map(r=>({ing:r.querySelector('select').value,qty:+r.querySelector('input').value})).filter(r=>r.qty>0);
 const o=id?d:{id:uid()};Object.assign(o,{name:v('f1').trim(),cat:v('f2'),yield:+v('f3')||1,price:+v('f4')||0,items});if(!id)S.dishes.push(o);render()});
 if(id)$('fd').onclick=()=>{ask('Delete this dish?',()=>{S.dishes=S.dishes.filter(x=>x.id!==id);render()})}}
function vDishes(){
 const ds=S.dishes.filter(d=>d.name.toLowerCase().includes(q.toLowerCase()));
 return `<div class="between"><div style="flex:1">${search('Search dishes')}</div><button class="btn gold" style="margin-top:8px" onclick="editDish()">+ Dish</button></div>`+
 CATS.map(c=>{const l=ds.filter(d=>d.cat===c);return l.length?`<h2>${c}</h2>`+l.map(d=>{const cost=dcost(d),mg=d.price-cost,pct=d.price?mg/d.price*100:0;
 return `<div class="card" onclick="editDish('${d.id}')" style="cursor:pointer"><div class="between"><b>${esc(d.name)}</b><span class="tag">${d.items.length} ingredients</span></div>
 ${d.items.length?`<div class="g2" style="margin-top:6px"><div class="mut">Cost / batch<br><b style="color:var(--ink);font-size:16px">${P(cost)}</b></div><div class="mut">Cost / serving (÷${N(d.yield)})<br><b style="color:var(--ink);font-size:16px">${P(cost/d.yield)}</b></div></div>
 ${d.price?`<div class="mut" style="margin-top:4px">Price ${P(d.price)} · Profit <b class="${mg>=0?'ok':'bad'}">${P(mg)} (${pct.toFixed(0)}%)</b></div>`:'<div class="mut" style="margin-top:4px">Tap to set a selling price</div>'}`:'<div class="mut">Tap to add the recipe &amp; costing</div>'}</div>`}).join(''):''}).join('')}
/* COOK */
let cd='',cb=1;
function vCook(){
 const d=dish(cd);const withR=S.dishes.filter(x=>x.items.length);
 let prev='';if(d){const L=lines(d,cb),tot=L.reduce((a,l)=>a+l.cost,0);prev=`<div class="card"><b>This will deduct:</b>${L.map(l=>{const i=ing(l.ing),short=i.stock<l.qty;return `<div class="between" style="margin-top:6px"><span>${esc(l.name)}</span><span class="${short?'bad':''}">${l.qty} ${esc(l.unit)} <span class="mut">(have ${N(i.stock)})</span></span></div>`}).join('')}
 <hr style="border:0;border-top:1px solid var(--line)"><div class="between"><span>Total cost</span><b>${P(tot)}</b></div><div class="between mut"><span>Per serving</span><span>${P(tot/(d.yield*cb))}</span></div></div><button class="btn gold" style="width:100%;padding:13px" onclick="doCook()">Cook &amp; deduct stock</button>`}
 return `<h2>Cook a dish</h2>${withR.length?`<label>Dish</label><select onchange="cd=this.value;render()"><option value="">Choose a dish…</option>${CATS.map(c=>{const l=withR.filter(x=>x.cat===c);return l.length?`<optgroup label="${c}">${l.map(x=>`<option value="${x.id}" ${x.id===cd?'selected':''}>${esc(x.name)}</option>`).join('')}</optgroup>`:''}).join('')}</select>
 <label>Number of batches</label><input type="number" step="any" min="0" value="${cb}" onchange="cb=+this.value||1;render()">${prev}`:'<div class="empty">No dish has a recipe yet. Open the Menu cost tab and add ingredients to a dish first.</div>'}`}
function doCook(f){const d=dish(cd);if(!d||!(cb>0))return;const L=lines(d,cb);const short=L.filter(l=>ing(l.ing).stock<l.qty);
 if(short.length&&!f){ask('Not enough stock for: '+short.map(s=>s.name).join(', ')+'. Cook anyway? Stock will go negative.',()=>doCook(true));return}if(false&&!confirm('Not enough stock for: '+short.map(s=>s.name).join(', ')+'.\nCook anyway? Stock will go negative.'))return;
 L.forEach(l=>{const i=ing(l.ing);i.stock=N(i.stock-l.qty)});
 S.logs.unshift({id:uid(),ts:Date.now(),dish:d.id,name:d.name,batches:cb,yield:d.yield,items:L,cost:L.reduce((a,l)=>a+l.cost,0)});
 cd='';cb=1;render();toast('Cooked! Stock updated')}
/* HISTORY */
function vHist(){return `<h2>Cooking history</h2><p class="mut">Made a mistake? Edit the batches or delete the entry — your stock is corrected automatically.</p>`+
 (S.logs.length?S.logs.map(l=>`<div class="card"><div class="between"><div><b>${esc(l.name)}</b> <span class="tag">× ${N(l.batches)} batch</span><div class="mut">${new Date(l.ts).toLocaleString('en-PH',{dateStyle:'medium',timeStyle:'short'})}</div></div><b>${P(l.cost)}</b></div>
 <div class="mut" style="margin-top:6px">${l.items.map(i=>`${esc(i.name)} ${i.qty} ${esc(i.unit)}`).join(' · ')}</div>
 <div class="row"><button class="btn sm ghost" onclick="editLog('${l.id}')">Edit</button><button class="btn sm red" onclick="delLog('${l.id}')">Delete</button></div></div>`).join(''):'<div class="empty">Nothing cooked yet. Your cooking entries will show here.</div>')}
function editLog(id){const l=S.logs.find(x=>x.id===id);
 modal('Edit '+esc(l.name),`<label>Number of batches cooked</label><input id="f1" type="number" step="any" value="${l.batches}"><p class="mut">Stock is restored from the old amount, then the new amount is deducted.</p>`,()=>{
 const nb=+v('f1');if(!(nb>0))return false;const k=nb/l.batches;
 l.items.forEach(it=>{const i=ing(it.ing);const nq=N(it.qty*k);if(i)i.stock=N(i.stock+it.qty-nq);it.cost=it.cost*k;it.qty=nq});
 l.cost=l.items.reduce((a,x)=>a+x.cost,0);l.batches=nb;render();toast('Entry updated')})}
function delLog(id){const l=S.logs.find(x=>x.id===id);ask('Delete this entry and put the ingredients back in stock?',()=>{
 l.items.forEach(it=>{const i=ing(it.ing);if(i)i.stock=N(i.stock+it.qty)});S.logs=S.logs.filter(x=>x!==l);render();toast('Stock restored')})}
/* BACKUP */
function exp(){modal('Backup',`<p class="mut">Copy this text and keep it safe (e.g. send it to yourself).</p><textarea id="f1" style="width:100%;height:160px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:9px">${esc(JSON.stringify(S))}</textarea>`,()=>true,'Done')}
function imp(){modal('Import backup',`<p class="mut">Paste a backup. This replaces current data.</p><textarea id="f1" style="width:100%;height:160px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:9px"></textarea>`,()=>{try{const s=JSON.parse(v('f1'));if(!s.ings||!s.dishes)throw 0;S=s;render();toast('Backup restored')}catch(e){toast('That backup text is not valid');return false}},'Restore')}
render();initCloud();
</script></body></html>
